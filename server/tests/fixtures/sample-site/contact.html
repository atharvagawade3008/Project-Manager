<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Northwind Consulting</title>
    <meta name="description" content="Tell us about your operations project and we will reply within two working days." />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/services">Services</a>
        <a href="/contact">Contact</a>
      </nav>
    </header>
    <main>
      <section class="page-intro">
        <h1>Contact us</h1>
        <p>Tell us about the project and the outcome you need.</p>
      </section>
      <section class="contact-form">
        <form class="contact">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
          <button type="submit">Send enquiry</button>
        </form>
      </section>
      <img src="/hero.jpg" />
    </main>
    <footer>
      <p>Northwind Consulting, 2026. All rights reserved.</p>
    </footer>
  </body>
</html>
